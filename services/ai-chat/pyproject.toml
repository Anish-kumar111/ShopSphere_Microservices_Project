[project]
name = "ai-chat"
version = "0.1.0"
requires-python = ">=3.12"
# Add libraries as you build the service: uv add --package ai-chat <library>
dependencies = ["shopsphere-shared", "fastapi>=0.115"]

[project.scripts]
ai-chat = "ai_chat.main:run"

[tool.uv.sources]
shopsphere-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
