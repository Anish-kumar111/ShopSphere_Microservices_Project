[project]
name = "import-api"
version = "0.1.0"
requires-python = ">=3.12"
# Add libraries as you build the service: uv add --package import-api <library>
dependencies = ["shopsphere-shared", "fastapi>=0.115"]

[project.scripts]
import-api = "import_api.main:run"

[tool.uv.sources]
shopsphere-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
