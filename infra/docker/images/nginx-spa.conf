# Serves a single-page app (the React admin). Runs as non-root on port 8080.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /health/live  { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location = /health/ready { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }

    # Vite puts hashed files in /assets: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a client-side route: serve index.html, never cache it.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
